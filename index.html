    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Limi" />
    <link rel="manifest" href="/manifest.json" />
    <title>Limi</title>
    <!-- Apply the saved theme before React mounts. Light by default, as
         ThemeContext is: a dark default here flashed dark on every first load. -->
    <script>
      (function(){
        if (localStorage.getItem('limi_theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1c1b1f');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap" rel="stylesheet" />
